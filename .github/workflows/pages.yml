# Builds the Vite app and publishes dist/ to GitHub Pages.
#
# Replaces the previous workflow that uploaded the whole repository, which leaked
# res/player_data and the source tree to a public URL.
name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# Least privilege: read the repo, write only to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. Never cancel a run that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Runs prepare:assets, the loader contract check, tsc and vite build.
      - name: Build
        run: npm run build

      - name: Guard against Jekyll stripping the data directory
        run: touch dist/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4